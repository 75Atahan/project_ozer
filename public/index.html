<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LSÖ — Gündelik Asistan</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#12324A">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>LSÖ</h1>
      <div id="locLabel" class="loc-label">Mordoğan, İzmir</div>
    </header>

    <div class="preset-row" id="presetRow">
      <button class="preset" data-lat="38.5182" data-lon="26.6267" data-name="Mordoğan, İzmir">Mordoğan</button>
      <button class="preset" data-lat="38.6674" data-lon="26.7535" data-name="Eski Foça, İzmir">Eski Foça</button>
      <button class="preset" data-lat="38.4600" data-lon="27.1200" data-name="Karşıyaka, İzmir">Karşıyaka</button>
    </div>

    <section class="card" id="weatherCard">
      <h2>Hava Durumu</h2>
      <div class="skel" id="weatherBody">Yükleniyor…</div>
    </section>

    <section class="card" id="marineCard">
      <h2>Deniz / Dalga</h2>
      <div class="skel" id="marineBody">Yükleniyor…</div>
    </section>

    <section class="card" id="financeCard">
      <h2>Finans</h2>
      <div class="skel" id="financeBody">Yükleniyor…</div>
    </section>

    <section class="card" id="quakeCard">
      <h2>Son 24 Saatte Depremler</h2>
      <div class="skel" id="quakeBody">Yükleniyor…</div>
    </section>

    <section class="card" id="newsCard">
      <h2>Gündem</h2>
      <div class="skel" id="newsBody">Yükleniyor…</div>
    </section>

    <footer>
      Veriler Open-Meteo ve Darphane açık kaynaklarından canlı çekilir. · LSÖ MVP
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
